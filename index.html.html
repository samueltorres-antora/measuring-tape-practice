<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Tape Measure Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #0f0f0d;
  --surface:    #1a1a16;
  --surface2:   #222219;
  --border:     #2e2e26;
  --border2:    #3c3c30;
  --text:       #e8e4d0;
  --text2:      #9c9880;
  --text3:      #5c5a48;
  --accent:     #c87941;
  --accent2:    #a85f28;
  --green:      #5a9e5a;
  --green-bg:   rgba(90,158,90,.14);
  --red:        #c05050;
  --red-bg:     rgba(192,80,80,.14);
  --radius:     8px;
  --radius-lg:  12px;
  --mono:       'DM Mono', monospace;
  --sans:       'DM Sans', sans-serif;
  --ease:       .18s ease;
  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left:   env(safe-area-inset-left, 0px);
  --safe-right:  env(safe-area-inset-right, 0px);
}

html { font-size: 16px; -webkit-text-size-adjust: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-weight: 300;
  min-height: 100dvh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}

.app {
  max-width: 780px;
  margin: 0 auto;
  padding:
    calc(1.25rem + var(--safe-top))
    calc(1rem + var(--safe-right))
    calc(3rem + var(--safe-bottom))
    calc(1rem + var(--safe-left));
}

/* Header */
.header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: .75rem;
  margin-bottom: 1.25rem;
  padding-bottom: 1.1rem;
  border-bottom: 1px solid var(--border);
}

.header-eyebrow {
  font-family: var(--mono);
  font-size: .65rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: .25rem;
}

.header-title {
  font-size: clamp(1.1rem, 4vw, 1.55rem);
  font-weight: 500;
  color: var(--text);
  line-height: 1.2;
  letter-spacing: -.01em;
}

.header-sub {
  font-size: .8rem;
  color: var(--text2);
  margin-top: .2rem;
  display: none;
}

/* Mode tabs */
.mode-tabs {
  display: flex;
  gap: 3px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: calc(var(--radius-lg) + 2px);
  padding: 3px;
  flex-shrink: 0;
  align-self: flex-start;
  margin-top: .1rem;
}

.mtab {
  font-family: var(--mono);
  font-size: .68rem;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 9px 16px;
  min-height: 38px;
  border-radius: var(--radius-lg);
  border: none;
  cursor: pointer;
  color: var(--text2);
  background: transparent;
  transition: var(--ease);
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}

.mtab.active { background: var(--accent); color: #fff; font-weight: 500; }

/* Panel */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: .75rem;
}

.panel-header {
  padding: .9rem 1rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
}

.panel-title-group { min-width: 0; flex: 1; }

.panel-title {
  font-size: .95rem;
  font-weight: 500;
  color: var(--text);
  letter-spacing: -.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.panel-sub {
  font-size: .75rem;
  color: var(--text2);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.panel-body { padding: .9rem 1rem; }

/* Slide nav */
.slide-nav-strip {
  display: flex;
  align-items: center;
  gap: .45rem;
  flex-shrink: 0;
}

.snav-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text2);
  font-size: 1rem;
  transition: var(--ease);
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.snav-btn:active { background: var(--border); color: var(--text); }
.snav-btn:disabled { opacity: .2; cursor: default; pointer-events: none; }

.snav-count {
  font-family: var(--mono);
  font-size: .7rem;
  color: var(--text2);
  min-width: 36px;
  text-align: center;
}

.snav-random {
  font-family: var(--mono);
  font-size: .63rem;
  letter-spacing: .04em;
  text-transform: uppercase;
  padding: 0 11px;
  height: 40px;
  background: transparent;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--text3);
  cursor: pointer;
  transition: var(--ease);
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.snav-random:active { color: var(--text); border-color: var(--accent); }

/* Legend */
.legend {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-bottom: .8rem;
}

.leg {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .03em;
  color: var(--text2);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 9px 4px 7px;
  white-space: nowrap;
}

.leg-line { border-radius: 1px; flex-shrink: 0; background: var(--text); }

/* Tape wrapper — scrollable on narrow phones */
.tape-scroll {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin-bottom: .8rem;
  scrollbar-width: none;
  cursor: grab;
}
.tape-scroll:active { cursor: grabbing; }
.tape-scroll::-webkit-scrollbar { display: none; }
.tape-scroll svg { display: block; min-width: 340px; }

/* Detail */
.detail {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: .85rem .95rem;
  min-height: 80px;
}

.detail-title {
  font-size: .88rem;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.detail-body { font-size: .83rem; color: var(--text2); line-height: 1.65; }

.detail-hint {
  font-size: .77rem;
  color: var(--text3);
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  display: none;
  line-height: 1.55;
}

/* Tags */
.tag {
  font-family: var(--mono);
  font-size: .6rem;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 3px;
  white-space: nowrap;
  font-weight: 500;
}

.tag-sixteenth { background: rgba(200,121,65,.18); color: #e09060; border: 1px solid rgba(200,121,65,.3); }
.tag-eighth    { background: rgba(100,175,100,.15); color: #80cc80; border: 1px solid rgba(100,175,100,.25); }
.tag-quarter   { background: rgba(90,140,210,.15);  color: #80b0e8; border: 1px solid rgba(90,140,210,.25); }
.tag-half      { background: rgba(210,190,60,.15);  color: #d4cc50; border: 1px solid rgba(210,190,60,.25); }
.tag-anchor    { background: rgba(160,160,140,.1);  color: var(--text2); border: 1px solid var(--border); }

/* Dots */
.dots {
  display: flex;
  gap: 4px;
  justify-content: center;
  flex-wrap: wrap;
  padding: .3rem .5rem;
}

.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--border2);
  cursor: pointer;
  transition: background .15s, transform .15s;
  -webkit-tap-highlight-color: transparent;
  padding: 6px;
  margin: -6px;
}

.dot.on { background: var(--accent); transform: scale(1.45); }

/* Quiz */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 7px;
  margin-bottom: .9rem;
}

.stat-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: .65rem .5rem;
  text-align: center;
}

.stat-label {
  font-family: var(--mono);
  font-size: .58rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 3px;
}

.stat-value {
  font-family: var(--mono);
  font-size: 1.35rem;
  font-weight: 500;
  color: var(--text);
}

.stat-card.green .stat-value { color: var(--green); }
.stat-card.red   .stat-value { color: var(--red); }
.stat-card.amber .stat-value { color: var(--accent); }

.progress-wrap {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  margin-bottom: 1.1rem;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width .4s ease;
}

.quiz-prompt {
  font-size: .95rem;
  font-weight: 500;
  color: var(--text);
  text-align: center;
  margin-bottom: 1rem;
  line-height: 1.45;
  padding: 0 .25rem;
}

/* single column on mobile */
.quiz-opts {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin-bottom: .9rem;
}

.qopt {
  padding: .9rem 1rem;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-family: var(--mono);
  font-size: .9rem;
  cursor: pointer;
  text-align: center;
  color: var(--text);
  transition: background .1s, border-color .1s;
  min-height: 50px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.qopt:active:not(:disabled) { background: var(--surface); border-color: var(--border2); }
.qopt:disabled { cursor: default; }
.qopt.correct { background: var(--green-bg); border-color: var(--green); color: #80cc80; }
.qopt.wrong   { background: var(--red-bg);   border-color: var(--red);   color: #e08080; }

.quiz-click-hint {
  text-align: center;
  font-size: .75rem;
  color: var(--text3);
  font-family: var(--mono);
  margin-bottom: .6rem;
  letter-spacing: .03em;
}

.quiz-feedback {
  text-align: center;
  font-size: .85rem;
  font-weight: 500;
  min-height: 24px;
  margin-bottom: .75rem;
  line-height: 1.45;
  padding: 0 .25rem;
}

.quiz-next-btn {
  display: none;
  margin: 0 auto;
  font-family: var(--mono);
  font-size: .72rem;
  letter-spacing: .07em;
  text-transform: uppercase;
  padding: 0 28px;
  height: 46px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background var(--ease);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.quiz-next-btn:active { background: var(--accent2); }

.restart-btn {
  font-family: var(--mono);
  font-size: .63rem;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 0 12px;
  height: 36px;
  background: transparent;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--text3);
  cursor: pointer;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}

.restart-btn:active { color: var(--text); border-color: var(--accent); }

/* Desktop enhancements */
@media (min-width: 500px) {
  .header-sub { display: block; }
  .quiz-opts { grid-template-columns: 1fr 1fr; }
}

@media (min-width: 540px) {
  .app { padding: 2rem 1.5rem 4rem; }
  .panel-body { padding: 1.2rem 1.35rem; }
  .panel-header { padding: 1rem 1.35rem; }
  .snav-btn { width: 32px; height: 32px; font-size: .9rem; }
  .snav-random { height: 32px; }
  .mtab { min-height: 32px; padding: 7px 18px; }
}

@media (min-width: 700px) {
  .app { padding: 2.5rem 2rem 4rem; }
}
</style>
</head>
<body>

  <header class="header">
    <div>

      <h1 class="header-title">Tape Measure Trainer</h1>
      <p class="header-sub">Learn to read every fraction from 1⁄16″ to 1″</p>
    </div>
    <div class="mode-tabs">
